[package]
name = "ofm_core"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
log = "0.4"
domain = { version = "0.3.0", path = "../domain" }
engine = { version = "0.3.0", path = "../engine" }
rand = "0.10"
# Named, not `rand::rngs::StdRng`: rand reserves the right to change what StdRng is, and a saved
# career must replay the same way after a dependency bump. See `Game::rng_for`.
rand_chacha = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1.21.0", features = ["v4"] }
zip = { version = "2", features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# The M12 engine, pinned to the exact commit a build was verified with. The repository is private:
# resolving this needs git access to it (a credential helper, `gh auth setup-git`, or a CI token);
# nothing secret is stored here. For local development against a sibling checkout see
# `.cargo/config.toml.example` (a `paths` override, which leaves Cargo.lock untouched).
apfm-match-lab = { git = "https://github.com/augustinpatte/apfm-match-lab", rev = "d4e6f329d7e48279a9dce5f7f3c1b970f7ff2131" }

[lints]
workspace = true

[dev-dependencies]
proptest = "=1.12.0"

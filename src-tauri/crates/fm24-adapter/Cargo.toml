[package]
name = "fm24-adapter"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reads the FM24 world.db (read-only) and produces an Openfoot Manager world (APFM)."

[lib]
name = "fm24_adapter"
path = "src/lib.rs"

[[bin]]
name = "apfm-import"
path = "src/main.rs"

[dependencies]
ofm_core = { path = "../ofm_core" }
domain = { path = "../domain" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4.44"
rand = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# Paramètres de l'adaptateur FM24 -> Openfoot Manager. Versionné : toute valeur qui change le monde produit
# est ici (jamais en dur dans le code), pour que « mêmes données + même config + même version » donne le même hash.

[world]
id = "apfm-fm24-2026"
name = "AP Football Manager — FM24 2026/27"
description = "240 clubs réels (12 divisions) importés d'une sauvegarde FM24, saison 2026/27."
version = "0.1.0"
author = "AP Football Manager"
license = "LicenseRef-APFM-private"
base_year = 2026
# Graine de la construction du monde OFM (joueurs/staff de complément, capacité des stades, condition, moral).
seed = 20262027

[money]
# 1 £ = x €. OFM compte en euros ; world.db en livres. Taux FIXE (documenté), jamais lu en ligne.
gbp_to_eur = 1.17

[start]
# Date initiale CONFIGURÉE (jamais extraite de la save : sa date est ambiguë). Valeur native d'OFM pour 2026
# (année de Coupe du monde -> 1er juin, voir ofm_core::world::start_date_for_year), phase « seasonStart ».
date = "2026-06-01"
phase = "seasonStart"

[contracts]
# Contrat sans date de fin dans la save (337 joueurs du périmètre) : fin générée, marquée « générée ».
missing_end = "2027-06-30"

[loans]
# World.db registers each player with a team (`player.registered_team_id`); when that club is not the one that
# holds his contract, he plays elsewhere under his owner's contract (a loan, or an affiliated side such as
# Bayern II). Such a player is imported as an OFM loan: `team_id` = where he plays, `active_loan.parent_team_id`
# = his owner. The save does not carry the terms, so they are configured (marked generated in the report):
# the loan ends with the season (capped by his contract), the borrower pays this share of the wage.
# 0 keeps the owner's wage bill as the importer's finances computed it.
enabled = true
end_date = "2027-06-30"
wage_contribution_pct = 0

[ratings]
# Niveau d'un joueur sur l'échelle OFM = courbe monotone du CA FM (1-200, déjà pondéré par poste par FM).
# Une moyenne pondérée d'attributs écrase la hiérarchie (un latéral de classe mondiale, 90 en vitesse et
# accélération, tombe vers 67, à peine au-dessus d'un bon défenseur de deuxième division) : le niveau vient
# donc du CA et les attributs sont déplacés à ce niveau en gardant leur forme (voir src/ratings.rs).
# Le potentiel est lu sur la même courbe au PA, jamais sous la note, jamais au-dessus de 99.
# Repères : CA 75 = plancher de la 2. Bundesliga (~57), CA 100 = joueur de division moyenne (~66),
# CA 150 = titulaire solide de grand championnat (~83), CA 180+ = classe mondiale (~92).
anchor_to_ca = true
ca_to_ovr = [
  [1, 25], [40, 42], [60, 51], [75, 57], [90, 62], [100, 66], [120, 74], [135, 79],
  [150, 83], [165, 88], [180, 92], [200, 97],
]

[positions]
# Note FM (1-20) à partir de laquelle un poste secondaire est « compétent ».
alternate_min_rating = 15
# Poste naturel : parmi les postes notés à au plus 1 point de la meilleure note FM, celui que la note OFM
# (calculée sur les attributs convertis) place le plus haut. Un écart de 1 point FM (20 vs 19) est du bruit.
natural_within = 1
# Pied : les deux pieds >= both_feet_min (sur 100) -> "Both".
both_feet_min = 75

[squad]
# Après construction, OFM complète chaque effectif à 22 par des joueurs GÉNÉRÉS. On ne garde de ces joueurs
# que ce qui est nécessaire au plancher de jeu d'OFM (squad_floor : 15 seniors, dont 2 G / 4 D / 4 M / 2 A).
trim_generated_to_floor = true
# Les joueurs générés par OFM sont à l'échelle d'OFM (≈ 66 de note, ≈ 11 000/semaine), pas à celle de la
# division du club (≈ 56, 700 à 2 500). Ceux qui dépassent la médiane des joueurs importés de la division
# sont ramenés à cette médiane (note et salaire) ; les joueurs importés ne sont jamais modifiés.
calibrate_generated_to_division = true
# Before inventing a filler, a club short of the floor promotes players of its own academy side (the save's
# reserve and youth teams) to its senior squad, best rated first. Only what is still missing is generated.
promote_academy_before_generating = true
# Squad status (`contract.squad_status_code`) is undocumented in the save. 10, 11 and 13 are read as youth
# statuses because, on the 2026-27 save, 99 % of the players registered with a club's own reserve or youth
# side carry one of them and their mean ages are 19 to 20. Registration decides senior or academy; a
# reserve-registered player of academy age whose status is another code AND whose ability reaches the
# floor of his club's first team (the percentile below of its first-team registrations) is read as a
# first-team player whose registration lags. Ability alone never promotes: elite prospects stay in academies.
youth_status_codes = [10, 11, 13]
senior_status_promotion = true
senior_floor_percentile = 25
senior_floor_min_players = 8

[finance]
# Une valeur FM n'est restaurée que si elle est compatible (budget salaires >= masse salariale hebdomadaire).
restore_balance = true
restore_transfer_budget = true
restore_wage_budget = true
# OFM's own income is a flat gate and an optional sponsor, which cannot pay FM24-sized wage bills
# (a Paris Saint-Germain with 150 M a year of wages and 6 M of gate is sacked in its second season).
# The source's non-wage net income (TV + other revenue - other costs, generated by the importer) is
# paid as a permanent sponsorship, less the gate OFM itself will credit.
restore_recurring_income = true
max_commitment_share_of_income_pct = 110

[free_agents]
# Les 20 448 joueurs sans contrat de la save mélangent de vrais agents libres, des joueurs de clubs de
# ligues non chargées et des retraités (jusqu'à 85 ans). Un POOL ACTIF borné entre dans le monde ; le reste
# reste dans world.db (jamais modifié). Les 220 joueurs libres générés par la Coupe du monde d'OFM restent.
enabled = true
age_on = "2026-06-01"
min_age = 16
max_age = 36
# Seuil de niveau : sous le 10e centile de la division simulée la plus faible (2. Bundesliga : CA 72).
min_ca = 75
prospect_max_age = 21
prospect_min_pa = 100
prospect_min_ca = 45
# Taille du pool actif (mesurée : voir docs/APFM_ECONOMY_TRANSFER_REPORT.md).
pool_size = 3000
# Le salaire demandé est ce quantile des salaires des joueurs sous contrat de même niveau et de même âge
# (un agent libre négocie plus faiblement qu'un joueur en poste).
wage_quantile = 0.30
ca_window = 4

[valuation]
# Estimated market value (src/valuation.rs). The save stores a value per player but it is noisy: among
# players of the same ability, age and position the saved values of a comparable group span a factor of
# about eight, so a 28-year-old of CA 161 could be priced above a 27-year-old of CA 191. A log-linear model
# (ability, age, potential gap, contract, club reputation, position) is fitted on the world's own saved
# values; a saved value is kept exactly while it lies within `trust_save` median absolute deviations of
# the model's estimate and is pulled to the edge of that band beyond it.
min_samples = 500
ridge = 1e-6
trim_sd = 2.0
trust_save = 0.75
# Below the estimate the band is wider: the model is least reliable at the very top and for prospects.
trust_save_below = 1.5
# A value the save generated from its own regression is a model output, not an observation.
trust_estimated = 0.25
minimum_value_eur = 10000
# A player's value is his own, not a club's: no budget bounds it. Whether a club can afford him is judged
# per buyer by the game (cash, transfer budget, wage room), which is where affordability belongs.

[value_scale]
# The world's value scale (src/valuation.rs `fit_value_scale`), fitted from the players this import has valued:
# the median value of prime-age players at ratings 30, 35 ... 95, and the median value of each age against that
# curve. Every price made later (a newgen's, a renewed contract's wage) is read from it, and a value carried from
# one season to the next moves by its ratio, so a projection no longer re-prices a player on another scale.
first_anchor = 30
last_anchor = 95
anchor_step = 5
window = 2
min_per_anchor = 5
min_per_age = 20
prime_age_from = 26
prime_age_to = 29

# --- Calendriers nationaux -----------------------------------------------------------------------
# La forme d'une semaine de football par ligue, pas les calendriers officiels (qui sont sous licence
# et que cette importation ne reproduit pas). `weekend` : poids relatif de chaque jour, du lundi au
# dimanche, pour une journée ordinaire; `midweek` : idem pour une journée en semaine;
# `midweek_rounds` : journées jouées en semaine au minimum (le planificateur en ajoute autant que la
# fenêtre de la saison en exige); la saison doit être finie à `season_end_*`. Un club garde au moins
# trois jours de repos entre deux matchs. Une ligue absente garde la cadence d'un jour par semaine.
# Dates générées: PAS des dates officielles.

# England: Saturday afternoon first, a Sunday slot, a few Friday/Monday kick-offs; Tuesday/Wednesday
# rounds, many more in the 46-game divisions.
[[calendar.league]]
country = "ENG"
tier = 1
weekend = [1, 0, 0, 0, 1, 12, 6]
midweek = [0, 1, 1, 0, 0, 0, 0]
midweek_rounds = 4
season_end_month = 5
season_end_day = 24

[[calendar.league]]
country = "ENG"
tier = 2
weekend = [0, 0, 0, 0, 2, 14, 1]
midweek = [0, 3, 3, 0, 0, 0, 0]
midweek_rounds = 8
season_end_month = 5
season_end_day = 3

[[calendar.league]]
country = "ENG"
tier = 3
weekend = [0, 0, 0, 0, 1, 15, 0]
midweek = [0, 3, 3, 0, 0, 0, 0]
midweek_rounds = 8
season_end_month = 5
season_end_day = 3

